<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#0a84ff" />
<title>郑州及周边 · 天空观景指数</title>
<meta name="description" content="郑州及周边 150km 火烧云、云海与日出日落观景指数预报，基于 ECMWF、和风天气与大气光路物理推算。" />
<style>
  :root {
    --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
      "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    --radius-xs: 10px;
    --radius-sm: 14px;
    --radius-md: 20px;
    --radius-lg: 28px;
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 24px;
    --space-6: 32px;
    --space-7: 48px;
    --maxw: 1180px;
    --ease: cubic-bezier(0.32, 0.72, 0, 1);

    /* Semantic light palette */
    --bg: #f5f5f7;
    --bg-grad-a: #eef3fb;
    --bg-grad-b: #f7f4f1;
    --surface: rgba(255, 255, 255, 0.72);
    --surface-solid: #ffffff;
    --surface-2: rgba(255, 255, 255, 0.55);
    --border: rgba(0, 0, 0, 0.08);
    --separator: rgba(60, 60, 67, 0.14);
    --text: #1c1c1e;
    --text-2: #48484a;
    --text-3: #8e8e93;
    --accent: #0a84ff;
    --accent-soft: rgba(10, 132, 255, 0.14);
    --good: #30d158;
    --fair: #ffd60a;
    --poor: #ff9f0a;
    --bad: #ff453a;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05), 0 4px 16px rgba(0, 0, 0, 0.05);
    --shadow-md: 0 8px 30px rgba(0, 0, 0, 0.10);
    --shadow-lg: 0 24px 60px rgba(0, 0, 0, 0.16);
    /* Text-only ink variants (WCAG AA ≥4.5:1 on light surfaces) */
    --text-3-ink: #68686d;
    --accent-ink: #0066cc;
    --good-ink: #157a33;
    --fair-ink: #7a5600;
    --poor-ink: #9a4a00;
    --bad-ink: #b02318;
  }

  html[data-theme="dark"] {
    --bg: #000000;
    --bg-grad-a: #0b1020;
    --bg-grad-b: #10100f;
    --surface: rgba(28, 28, 30, 0.72);
    --surface-solid: #1c1c1e;
    --surface-2: rgba(44, 44, 46, 0.55);
    --border: rgba(255, 255, 255, 0.10);
    --separator: rgba(84, 84, 88, 0.5);
    --text: #f5f5f7;
    --text-2: #c7c7cc;
    --text-3: #8e8e93;
    --accent: #0a84ff;
    --accent-soft: rgba(10, 132, 255, 0.22);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.5), 0 4px 18px rgba(0, 0, 0, 0.4);
    --shadow-md: 0 10px 34px rgba(0, 0, 0, 0.55);
    --shadow-lg: 0 26px 70px rgba(0, 0, 0, 0.7);
    --text-3-ink: #a1a1a6;
    --accent-ink: #4da3ff;
    --good-ink: #30d158;
    --fair-ink: #ffd60a;
    --poor-ink: #ff9f0a;
    --bad-ink: #ff453a;
  }

  @media (prefers-color-scheme: dark) {
    html[data-theme="auto"] {
      --bg: #000000;
      --bg-grad-a: #0b1020;
      --bg-grad-b: #10100f;
      --surface: rgba(28, 28, 30, 0.72);
      --surface-solid: #1c1c1e;
      --surface-2: rgba(44, 44, 46, 0.55);
      --border: rgba(255, 255, 255, 0.10);
      --separator: rgba(84, 84, 88, 0.5);
      --text: #f5f5f7;
      --text-2: #c7c7cc;
      --text-3: #8e8e93;
      --accent-soft: rgba(10, 132, 255, 0.22);
      --text-3-ink: #a1a1a6;
      --accent-ink: #4da3ff;
      --good-ink: #30d158;
      --fair-ink: #ffd60a;
      --poor-ink: #ff9f0a;
      --bad-ink: #ff453a;
    }
  }

  @media (prefers-color-scheme: dark) {
    html[data-theme="auto"] .ov-row:hover { background: rgba(255,255,255,0.06); }
  }

  .skip-link {
    position: absolute; left: -9999px; top: 0; z-index: 200;
    padding: 10px 16px; border-radius: 0 0 10px 0;
    background: var(--accent); color: #fff;
    font-size: 14px; font-weight: 640; text-decoration: none;
  }
  .skip-link:focus { left: 0; outline: 2px solid #fff; outline-offset: -4px; }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    font-family: var(--font-sans);
    color: var(--text);
    background:
      radial-gradient(1200px 700px at 12% -10%, var(--bg-grad-a), transparent 60%),
      radial-gradient(1000px 600px at 95% 0%, var(--bg-grad-b), transparent 55%),
      var(--bg);
    background-attachment: fixed;
    line-height: 1.5;
    letter-spacing: -0.01em;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  a { color: var(--accent); text-decoration: none; }
  button { font-family: inherit; }
  [hidden] { display: none !important; }

  .wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 var(--space-4); }

  /* ---------------- Nav ---------------- */
  .nav-outer {
    position: sticky;
    top: 0;
    z-index: 1000;
    padding-top: env(safe-area-inset-top);
    background: color-mix(in srgb, var(--bg) 62%, transparent);
    -webkit-backdrop-filter: saturate(180%) blur(22px);
    backdrop-filter: saturate(180%) blur(22px);
    border-bottom: 0.5px solid var(--separator);
  }
  .nav {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    height: 56px;
    max-width: var(--maxw);
    margin: 0 auto;
    padding: 0 var(--space-4);
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand-mark {
    width: 32px; height: 32px; flex: none;
    border-radius: 9px;
    background: linear-gradient(140deg, #ffd60a, #ff9f0a 42%, #ff375f 78%, #bf5af2);
    box-shadow: 0 4px 14px rgba(255, 90, 60, 0.35), inset 0 0 0 0.5px rgba(255,255,255,0.4);
  }
  .brand-title { font-size: 16px; font-weight: 650; letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand-sub { font-size: 12px; color: var(--text-3-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nav-spacer { flex: 1 1 auto; }
  .nav-meta { display: flex; align-items: center; gap: var(--space-2); color: var(--text-3-ink); font-size: 12px; }
  .src-chips { display: none; gap: 6px; }
  @media (min-width: 780px) { .src-chips { display: flex; } }
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 560; color: var(--text-2);
    background: var(--surface-2); border: 0.5px solid var(--border);
    padding: 4px 9px; border-radius: 999px; white-space: nowrap;
  }
  .chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 22%, transparent); }

  .icon-btn {
    -webkit-appearance: none; appearance: none;
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    height: 44px; min-width: 44px; padding: 0 12px;
    border-radius: 999px; border: 0.5px solid var(--border);
    background: var(--surface-2); color: var(--text);
    font-size: 13px; font-weight: 560; cursor: pointer;
    transition: transform 0.18s var(--ease), background 0.18s var(--ease);
    -webkit-tap-highlight-color: transparent;
  }
  .icon-btn:hover { background: var(--accent-soft); }
  .icon-btn:active { transform: scale(0.94); }
  .icon-btn svg { width: 17px; height: 17px; }
  .icon-btn.spin svg { animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .icon-btn .label { display: none; }
  @media (min-width: 560px) { .icon-btn .label { display: inline; } }

  /* ---------------- Hero / Banner ---------------- */
  .hero { padding: var(--space-6) 0 var(--space-4); }
  .hero h1 {
    margin: 0 0 var(--space-2);
    font-size: clamp(26px, 5.2vw, 40px);
    line-height: 1.12; font-weight: 720; letter-spacing: -0.03em;
  }
  .hero h1 .grad {
    background: linear-gradient(96deg, #ff9f0a, #ff375f 55%, #bf5af2);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hero p { margin: 0; color: var(--text-2); font-size: 15px; max-width: 62ch; }

  .banner { margin-top: var(--space-5); }
  .banner-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-3); margin-bottom: var(--space-3); flex-wrap: wrap; }
  .banner-head h2 { margin: 0; font-size: 20px; font-weight: 680; letter-spacing: -0.02em; }
  .banner-head .hint { color: var(--text-3-ink); font-size: 13px; }
  .banner-scroll { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(280px, 1fr); gap: var(--space-3); overflow-x: auto; padding: 4px 4px var(--space-4); scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
  @media (min-width: 900px) { .banner-scroll { grid-auto-flow: row; grid-template-columns: repeat(3, 1fr); overflow: visible; } }

  .day-card {
    scroll-snap-align: start;
    position: relative; overflow: hidden;
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-md);
    padding: var(--space-4);
    box-shadow: var(--shadow-sm);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    transition: transform 0.25s var(--ease), box-shadow 0.25s var(--ease);
  }
  .day-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .day-card.golden::before {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 3px;
    background: linear-gradient(90deg, #ffd60a, #ff9f0a, #ff375f, #bf5af2);
  }
  .day-top { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); }
  .day-date { font-size: 15px; font-weight: 650; }
  .day-week { color: var(--text-3-ink); font-weight: 500; margin-left: 6px; font-size: 13px; }
  .ribbon {
    font-size: 11px; font-weight: 650; color: #1c1c1e;
    background: linear-gradient(90deg, #ff9f0a, #ff375f);
    padding: 3px 9px; border-radius: 999px; letter-spacing: 0.01em;
    box-shadow: 0 3px 10px rgba(255, 55, 95, 0.32);
  }
  .slot { display: flex; align-items: center; gap: var(--space-3); margin-top: var(--space-3); padding-top: var(--space-3); border-top: 0.5px solid var(--separator); }
  .slot:first-of-type { margin-top: var(--space-3); }
  .slot-icon { font-size: 20px; width: 30px; text-align: center; flex: none; }
  .slot-body { min-width: 0; flex: 1; }
  .slot-label { font-size: 12px; color: var(--text-3-ink); font-weight: 560; }
  .slot-main { font-size: 14px; font-weight: 620; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .slot-sub { font-size: 12px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .slot-empty { color: var(--text-3-ink); font-size: 13px; }

  .index-pill {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 46px; padding: 5px 9px; border-radius: 12px;
    font-size: 14px; font-weight: 720; font-variant-numeric: tabular-nums;
    color: #1c1c1e;
  }

  /* ---------------- Section / cards ---------------- */
  section { margin-top: var(--space-6); }
  .section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-3); margin-bottom: var(--space-4); flex-wrap: wrap; }
  .section-head h2 { margin: 0; font-size: clamp(20px, 3.5vw, 26px); font-weight: 700; letter-spacing: -0.025em; }
  .section-head p { margin: 4px 0 0; color: var(--text-3-ink); font-size: 13px; }

  .panel {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    overflow: hidden;
  }

  .legend-note { font-size: 12px; color: var(--text-3-ink); }

  /* ---------------- Single-point detail (full width) ---------------- */
  .detail-col {
    width: 100%;
    max-width: 100%;
    min-width: 0;
    box-sizing: border-box;
  }
  .side-detail-card {
    width: 100%;
    max-width: 100%;
    min-width: 0;
    box-sizing: border-box;
    overflow: visible;
  }
  .side-detail-card, .detail-card, .panel-block, .detail-head, .pro-grid, .pro-cell {
    min-width: 0 !important;
    max-width: 100% !important;
    box-sizing: border-box !important;
    overflow-x: hidden !important;
    word-break: break-word !important;
  }
  /* ---------------- Compact decision strip (single-point) ---------------- */
  .detail-head-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .spot-select-control {
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    background: var(--surface-2);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-xs);
    padding: 11px 14px;
    min-height: 44px;
    outline: none;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
  }
  .detail-selects {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    min-width: 0;
    max-width: 100%;
  }
  .detail-selects .spot-select-control {
    min-width: 0;
    max-width: 100%;
    text-overflow: ellipsis;
  }
  @media (max-width: 560px) {
    .detail-selects { width: 100%; flex-direction: column; align-items: stretch; }
    .detail-selects .spot-select-control { width: 100%; }
  }

  #detailSection .section-head { margin-bottom: var(--space-3); }
  .detail-card {
    background: var(--surface); border: 0.5px solid var(--border);
    border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow: hidden;
  }
  .detail-head {
    display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap;
    padding: var(--space-4) var(--space-4) var(--space-3);
    border-bottom: 0.5px solid var(--separator);
    background: linear-gradient(120deg, var(--surface-2), transparent);
  }
  .detail-head .dh-name { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
  .detail-head .dh-meta { font-size: 12.5px; color: var(--text-3-ink); }
  .detail-head .dh-snap {
    margin-left: auto; font-size: 11.5px; font-weight: 640; color: var(--accent-ink);
    background: var(--accent-soft); padding: 5px 11px; border-radius: 999px; white-space: nowrap;
  }
  .detail-card .panel-block { padding: var(--space-4) var(--space-4) 0; }
  .detail-card .panel-block + .panel-block { padding-top: var(--space-3); }
  .detail-card .panel-block:last-child { padding-bottom: var(--space-4); }
  .detail-empty { padding: var(--space-6) var(--space-4); text-align: center; color: var(--text-3-ink); font-size: 13px; }

  /* ---------------- Detail two-column ---------------- */
  .detail-cols { display: grid; grid-template-columns: minmax(0, 1fr); min-width: 0; }
  .detail-cols > .dcol { min-width: 0; }
  @media (min-width: 980px) {
    .detail-cols {
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: var(--space-5); align-items: stretch;
      padding: 0 var(--space-4) var(--space-4);
    }
    .detail-cols .panel-block { padding-left: 0; padding-right: 0; }
    .detail-cols .dcol-right .panel-block { padding-top: var(--space-4); }
    .detail-cols .dcol { display: flex; flex-direction: column; }
    .detail-cols .dcol-right { justify-content: flex-start; }
  }

  /* ---------------- Compact spot cards ---------------- */
  .spot-grades { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 10px; }
  .spot-grade {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11.5px; font-weight: 620; padding: 4px 10px; border-radius: 999px;
    border: 0.5px solid var(--border); background: var(--surface-2); color: var(--text-2);
    white-space: nowrap; max-width: 100%;
  }
  .spot-grade b { font-variant-numeric: tabular-nums; font-weight: 720; color: var(--text); }
  .spot-grade .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .spot-grade .pill-date { margin-left: 5px; font-size: 11px; font-weight: 500; color: var(--text-3-ink); }
  .detail-head .icon-btn { margin-left: 0; }

  /* ---------------- Spot overview (table) ---------------- */
  .ov-list {
    background: var(--surface); border: 0.5px solid var(--border);
    border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);
    overflow: hidden; min-width: 0;
  }
  .ov-head, .ov-row {
    display: grid;
    grid-template-columns: 24px minmax(0, 1.25fr) repeat(3, minmax(0, 1.15fr));
    align-items: center;
    column-gap: var(--space-3);
    width: 100%;
    padding: 9px var(--space-4);
  }
  .ov-head {
    background: var(--surface-2);
    border-bottom: 0.5px solid var(--separator);
  }
  .ov-head-name {
    font-size: 11px; font-weight: 650; color: var(--text-3-ink); letter-spacing: 0.02em;
  }
  .ov-head-badge { width: 24px; height: 24px; }
  .ov-head .ov-day .d { font-size: 11px; font-weight: 600; color: var(--text-2); }
  .ov-head .ov-day .w { font-size: 11px; font-weight: 500; color: var(--text-3-ink); margin-top: 1px; }
  .ov-head .ov-day .u {
    font-size: 11px; font-weight: 500; color: var(--text-3-ink); opacity: 0.75; margin-top: 2px;
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; width: 100%;
  }
  .ov-head .ov-day .u span { text-align: center; white-space: nowrap; }
  .ov-row {
    border: 0; border-top: 0.5px solid var(--separator);
    background: transparent; color: inherit; font-family: inherit;
    text-align: left; cursor: pointer; min-height: 48px;
    transition: background 0.18s var(--ease);
  }
  .ov-row:first-of-type { border-top: 0; }
  .ov-row:hover { background: var(--surface-2); }
  .ov-row.is-active { background: var(--accent-soft); }
  .ov-row.is-active .ov-name .n::after { content: " · 当前"; font-size: 11px; font-weight: 600; color: var(--accent-ink); }
  html[data-theme="dark"] .ov-row:hover { background: rgba(255,255,255,0.06); }
  .ov-row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .ov-name { min-width: 0; }
  .ov-name .n {
    font-size: 14px; font-weight: 660; letter-spacing: -0.01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .ov-name .m {
    font-size: 11px; color: var(--text-3-ink); margin-top: 1px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .ov-name .m2 {
    font-size: 11px; font-weight: 500; color: var(--text-3-ink); margin-top: 1px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .ov-badge {
    flex: none; width: 24px; height: 24px; border-radius: 8px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 11.5px; font-weight: 780; letter-spacing: 0.02em;
    color: var(--accent-ink); background: var(--accent-soft);
    font-variant-numeric: tabular-nums;
  }
  .ov-day {
    display: flex; align-items: center; justify-content: center; gap: 1px; min-width: 0;
    border-left: 0.5px solid var(--separator); padding-left: 12px; padding-right: 12px;
  }
  .ov-head .ov-day { flex-direction: column; }
  .ov-tri { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; width: 100%; }
  .ov-m { display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 0; }
  .ov-m .k { font-size: 10.5px; font-weight: 600; color: var(--text-3-ink); line-height: 1.1; }
  .ov-m b { font-size: 13px; font-weight: 760; font-variant-numeric: tabular-nums; line-height: 1.15; }
  .ov-m.is-dim b { color: var(--text-3-ink); font-weight: 600; }
  .ov-times {
    font-size: 11px; font-weight: 500; color: var(--text-3-ink); margin-top: 2px;
    font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .ov-day .s {
    font-size: 12.5px; font-weight: 760; color: var(--text);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .ov-day .t {
    font-size: 11px; font-weight: 500; color: var(--text-3-ink);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .ov-day .t .k { margin-left: 3px; }
  .ov-day .s b {
    font-weight: 800; font-variant-numeric: tabular-nums; margin-left: 3px;
  }
  .ov-day .s em {
    font-style: normal; font-size: 11px; font-weight: 600; color: var(--text-3-ink);
    margin-left: 5px;
  }

  <script>
  (function () {
    "use strict";

    /* ------------------------------------------------------------------ *
     * Helpers                                                             *
     * ------------------------------------------------------------------ */
    var $ = function (id) { return document.getElementById(id); };

    function el(tag, cls, text) {
      var node = document.createElement(tag);
      if (cls) node.className = cls;
      if (text != null) node.textContent = text;
      return node;
    }

    function fmtUpdated(iso) {
      if (!iso) return "—";
      var d = new Date(iso);
      if (isNaN(d.getTime())) return iso;
      var pad = function (n) { return (n < 10 ? "0" : "") + n; };
      return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) +
        " " + pad(d.getHours()) + ":" + pad(d.getMinutes()) + "（本地）";
    }

    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

    /* Continuous colour ramps: fire clouds (yellow -> amber -> orange -> red ->
       magenta -> purple) and sea of clouds (mist white -> cold cyan-blue). */
    var STOPS = [
      { v: 0, c: [255, 224, 102] },
      { v: 20, c: [255, 214, 10] },
      { v: 40, c: [255, 159, 10] },
      { v: 60, c: [255, 55, 95] },
      { v: 80, c: [191, 90, 242] },
      { v: 100, c: [125, 42, 232] }
    ];
    function rampRGB(stops, v) {
      v = clamp(v, 0, 100);
      for (var i = 0; i < stops.length - 1; i++) {
        var a = stops[i], b = stops[i + 1];
        if (v <= b.v) {
          var t = (v - a.v) / (b.v - a.v || 1);
          return [
            Math.round(a.c[0] + (b.c[0] - a.c[0]) * t),
            Math.round(a.c[1] + (b.c[1] - a.c[1]) * t),
            Math.round(a.c[2] + (b.c[2] - a.c[2]) * t)
          ];
        }
      }
      var last = stops[stops.length - 1].c;
      return [last[0], last[1], last[2]];
    }
    function bciRGB(v) { return rampRGB(STOPS, v); }
    function bciColor(v) { var c = bciRGB(v); return "rgb(" + c[0] + "," + c[1] + "," + c[2] + ")"; }

    function num(x, d) { return (x == null || isNaN(x)) ? (d == null ? 0 : d) : +x; }

    function nearestHourly(hourly) {
      if (!hourly || !hourly.length) return null;
      var now = Date.now();
      var best = hourly[0], bestDiff = Infinity;
      for (var i = 0; i < hourly.length; i++) {
        var t = new Date(hourly[i].time).getTime();
        var diff = Math.abs(t - now);
        if (diff < bestDiff) { bestDiff = diff; best = hourly[i]; }
      }
      return best;
    }

    function toast(msg) {
      var t = $("toast");
      t.textContent = msg;
      t.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(function () { t.classList.remove("show"); }, 2400);
    }

    /* ------------------------------------------------------------------ *
     * State / theme                                                       *
     * ------------------------------------------------------------------ */
    var state = {
      data: null, spots: [], selectedSpotId: null, selectedEventKey: null
    };

    var THEME_ORDER = ["auto", "light", "dark"];
    function applyTheme(theme) {

      try { localStorage.setItem("sf-theme", theme); } catch (e) {}
      var icon = $("themeIcon");
      if (icon) {
        if (theme === "dark") {
          icon.innerHTML = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
        } else if (theme === "light") {
          icon.innerHTML = '<circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.4M12 19.6V22M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2 12h2.4M19.6 12H22M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"/>';
        } else {

    /* ------------------------------------------------------------------ *

      var sources = [

      sources.forEach(function (s) {

        c.appendChild(dot);

      $("footUpdated").textContent = "数据时间 " + fmtUpdated(meta.generated_at || data.updated_at);
    }

    /* ------------------------------------------------------------------ *
     * Banner                                                             *
     * ------------------------------------------------------------------ */
    /* WCAG 相对亮度与对比度；用于给彩色底挑选可读前景色。 */
    function relLum(c) {
      var v = [c[0], c[1], c[2]].map(function (x) {
        x = x / 255;
        return x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4);
      });
      return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
    }
    function contrastRatio(a, b) {
      var l1 = relLum(a), l2 = relLum(b);
      return (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05);
    }
    function mixRGB(c, target, t) {
      return [
        Math.round(c[0] + (target[0] - c[0]) * t),
        Math.round(c[1] + (target[1] - c[1]) * t),
        Math.round(c[2] + (target[2] - c[2]) * t)
      ];
    }
    /* 在色阶底上挑字色：先选对比度更高的深/浅字；
       若两者都不足 4.5:1（色阶 83–88 区间会出现），把底色朝所选字色方向最多提亮 6% 补足。 */
    function readableOn(rgb) {
      var white = [255, 255, 255], dark = [28, 28, 30];
      var cw = contrastRatio(white, rgb), cd = contrastRatio(dark, rgb);
      var useDark = cd >= cw;
      var ink = useDark ? dark : white;
      var bg = rgb.slice();
      for (var k = 1; k <= 10 && contrastRatio(ink, bg) < 4.5; k++) {
        bg = mixRGB(rgb, useDark ? white : [0, 0, 0], k * 0.006);
      }
      return { ink: useDark ? "#1c1c1e" : "#ffffff", bg: "rgb(" + bg[0] + "," + bg[1] + "," + bg[2] + ")" };
    }
    function indexPill(value) {
      var pill = el("span", "index-pill");
      var rgb = bciRGB(value);
      var pick = readableOn(rgb);
      pill.style.background = pick.bg;
      pill.style.color = pick.ink;
      pill.textContent = Math.round(value);
      return pill;
    }

    var MEDALS = ["\uD83E\uDD47", "\uD83E\uDD48", "\uD83E\uDD49"];

    /* One ranked spot row inside a day card. */
    function renderPick(rank, pick) {
      var row = el("div", "slot");
      row.appendChild(el("div", "slot-icon", MEDALS[rank] || String(rank + 1)));
      var body = el("div", "slot-body");
      body.appendChild(el("div", "slot-main", pick.spot.name + " \u00b7 " + pick.time));
      body.appendChild(el("div", "slot-sub",
        (pick.kind === "sunset" ? "\u843d\u65e5" : "\u65e5\u51fa") + " \u00b7 " +
        (pick.bci_grade || "\u2014") + " \u00b7 BCI " + Math.round(pick.bci)));
      row.appendChild(body);
      row.appendChild(indexPill(pick.bci));
      return row;
    }

    function renderBanner(data) {
      var box = $("bannerScroll");
      box.innerHTML = "";
      var dates = forecastDates(data);
      if (!dates.length) {
        var e = el("div", "empty");
        e.appendChild(el("div", "big", "\u2601\uFE0F"));
        e.appendChild(el("div", null, "\u6682\u65e0\u53ef\u7528\u7a97\u53e3"));
        box.appendChild(e);
        return;
      }

      var spots = data.spots || [];
      var peaks = spots.map(function (s) { return { spot: s, days: dayPeaks(s) }; });

      var dayLists = dates.map(function (date) {
        var list = [];
        peaks.forEach(function (p) {
          var pk = p.days[date];
          if (!pk) return;
          list.push({
            spot: p.spot, bci: pk.bci, sci: pk.sci, kind: pk.kind,
            bci_grade: pk.bci_grade, time: pk.time
          });
        });
        list.sort(function (a, b) { return b.bci - a.bci; });
        return { date: date, list: list.slice(0, 3) };
      });

      var bestOverall = -1;
      dayLists.forEach(function (d) {
        if (d.list.length && d.list[0].bci > bestOverall) bestOverall = d.list[0].bci;
      });

      dayLists.forEach(function (d) {
        var card = el("article", "day-card");
        var peak = d.list.length ? d.list[0].bci : -1;
        if (peak >= 0 && Math.abs(peak - bestOverall) < 0.05) card.classList.add("golden");
        var top = el("div", "day-top");
        var dateWrap = el("div");
        dateWrap.appendChild(el("span", "day-date", d.date.slice(5).replace("-", "\u6708") + "\u65e5"));
        dateWrap.appendChild(el("span", "day-week", weekdayOf(d.date)));
        top.appendChild(dateWrap);
        if (peak >= 0 && Math.abs(peak - bestOverall) < 0.05) {
          top.appendChild(el("span", "ribbon", "\u9ec4\u91d1\u7a97\u53e3"));
        } else if (peak >= 60) {
          top.appendChild(el("span", "ribbon", "\u503c\u5f97\u671f\u5f85"));
        }
        card.appendChild(top);
        if (!d.list.length) {
          card.appendChild(el("div", "slot-empty", "\u8be5\u65e5\u65e0\u6709\u6548\u7a97\u53e3"));
        } else {
          d.list.forEach(function (pick, i) { card.appendChild(renderPick(i, pick)); });
        }
        box.appendChild(card);
      });
    }

    /* ------------------------------------------------------------------ *
     * LOHUI-style decision / timeline / PRO analysis                      *
     * ------------------------------------------------------------------ */
    function fireVerdict(bci) {
      if (bci >= 75) return { tone: "go", label: "冲 · 绝美火烧云" };
      if (bci >= 55) return { tone: "wait", label: "蹲 · 值得一等" };
      if (bci >= 35) return { tone: "wait", label: "备 · 观望待命" };
      return { tone: "rest", label: "收脚架 · 安心休整" };
    }
    function seaVerdict(sci, status) {
      if (sci >= 60 || (status && status.indexOf("俯瞰") >= 0)) return { tone: "go", label: "冲 · 云海翻涌" };
      if (sci >= 35) return { tone: "wait", label: "蹲 · 云海可期" };
      return { tone: "rest", label: "收脚架 · 安心休整" };
    }
    /* ------------------------------------------------------------------ *
     * High-precision astronomical sunrise / sunset (minute-level).        *
     * NOAA solar-position algorithm: equation of time + solar declination *
     * with -0.833\u00B0 refraction-corrected horizon, local UTC+8 (120\u00B0E).   *
     * ------------------------------------------------------------------ */
    function calcSunTimes(lat, lon, dateObj) {
      var d = new Date(dateObj.getTime());
      var startOfYear = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
      var dayOfYear = Math.floor((d - startOfYear) / 86400000) + 1;
      var gamma = (2 * Math.PI / 365) * (dayOfYear - 1);
      var eqtime = 229.18 * (0.000075 + 0.001868 * Math.cos(gamma) - 0.032077 * Math.sin(gamma)
        - 0.014615 * Math.cos(2 * gamma) - 0.040849 * Math.sin(2 * gamma));
      var decl = 0.006918 - 0.399912 * Math.cos(gamma) + 0.070257 * Math.sin(gamma)
        - 0.006758 * Math.cos(2 * gamma) + 0.000907 * Math.sin(2 * gamma);
      var latRad = lat * Math.PI / 180;
      var cosHA = (Math.sin(-0.833 * Math.PI / 180) - Math.sin(latRad) * Math.sin(decl)) / (Math.cos(latRad) * Math.cos(decl));
      if (cosHA > 1) cosHA = 1; if (cosHA < -1) cosHA = -1;
      var haDeg = Math.acos(cosHA) * 180 / Math.PI;
      var noonMin = 720 - 4 * lon - eqtime + 8 * 60;
      var sunriseMin = noonMin - haDeg * 4;
      var sunsetMin = noonMin + haDeg * 4;
      return { sunriseMin: sunriseMin, sunsetMin: sunsetMin };
    }
    function formatMin(m) {
      m = Math.round(m);
      while (m < 0) m += 1440;
      m = m % 1440;
      var hh = Math.floor(m / 60);
      var mm = m % 60;
      return (hh < 10 ? "0" + hh : "" + hh) + ":" + (mm < 10 ? "0" + mm : "" + mm);
    }

    /* ---- Real sunrise / sunset events (minute precision, future only) ---- */
    var DAY_LABELS = ["\u4eca\u5929", "\u660e\u5929", "\u540e\u5929"];

    function pad2(n) { return (n < 10 ? "0" : "") + n; }

    function ymdOf(d) {
      return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
    }

    function minutesOf(hhmm) {
      var p = String(hhmm || "").split(":");
      return (parseInt(p[0], 10) || 0) * 60 + (parseInt(p[1], 10) || 0);
    }

    /* Enumerate the next 3 days of real sunrise / sunset instants.
       Only events still in the future are returned (past ones are dropped). */
    function buildEvents(spot) {
      var out = [];
      if (!spot || spot.lat == null || spot.lon == null) return out;
      var now = new Date();
      var nowMin = now.getHours() * 60 + now.getMinutes();
      for (var d = 0; d < 3; d++) {
        var day = new Date(now.getFullYear(), now.getMonth(), now.getDate() + d);
        var noon = new Date(day.getFullYear(), day.getMonth(), day.getDate(), 12, 0, 0);
        var st = calcSunTimes(spot.lat, spot.lon, noon);
        var defs = [
          { kind: "sunrise", label: "\u65e5\u51fa", min: st.sunriseMin },
          { kind: "sunset", label: "\u65e5\u843d", min: st.sunsetMin }
        ];
        for (var i = 0; i < defs.length; i++) {
          var ev = defs[i];
          if (d === 0 && ev.min <= nowMin) continue;
          out.push({
            id: ymdOf(day) + "|" + ev.kind,
            date: ymdOf(day),
            dayIndex: d,
            dayLabel: DAY_LABELS[d],
            kind: ev.kind,
            kindLabel: ev.label,
            minutes: ev.min,
            time: formatMin(ev.min),
            text: DAY_LABELS[d] + " \u00b7 " + ev.label + " " + formatMin(ev.min)
          });
        }
      }
      return out;
    }

    /* Nearest hourly sample to a real event instant, same local date. */
    function hourlyAtEvent(spot, ev) {
      var hours = (spot && spot.hourly) || [];
      if (!hours.length || !ev) return null;
      var best = null, bestDiff = Infinity;
      for (var i = 0; i < hours.length; i++) {
        var h = hours[i];
        var t = (h.time_local || "").slice(0, 16);
        if (t.slice(0, 10) !== ev.date) continue;
        var diff = Math.abs(minutesOf(t.slice(11, 16)) - ev.minutes);
        if (diff < bestDiff) { bestDiff = diff; best = h; }
      }
      return best || nearestHourly(hours);
    }

    /* Selected event for a spot; falls back to the nearest future event. */
    function resolveEvent(spot) {
      var events = buildEvents(spot);
      if (!events.length) return null;
      if (state.selectedEventKey) {
        for (var i = 0; i < events.length; i++) {
          if (events[i].id === state.selectedEventKey) return events[i];
        }
      }
      return events[0];
    }

    /* Populate the time dropdown for the current spot (future events only). */
    function renderTimeSelect(spot) {
      var sel = $("timeSelect");
      if (!sel) return null;
      var events = buildEvents(spot);
      sel.innerHTML = "";
      if (!events.length) {
        sel.disabled = true;
        return null;
      }
      sel.disabled = false;
      events.forEach(function (ev) {
        var opt = document.createElement("option");
        opt.value = ev.id;
        opt.textContent = "\uD83D\uDCC5 " + ev.text;
        sel.appendChild(opt);
      });
      var current = resolveEvent(spot);
      if (current) {
        state.selectedEventKey = current.id;
        sel.value = current.id;
      }
      sel.onchange = function () {
        state.selectedEventKey = sel.value;
        var s = null;
        (state.spots || []).forEach(function (x) {
          if (x.id === state.selectedSpotId) s = x;
        });
        if (s) renderSpotDetail(s);
      };
      return current;
    }

    /* ---- Shared day aggregation (3 days, golden windows only) ---- */
    var PINYIN_INITIAL = {
      "\u767d": "B", "\u5b9d": "B", "\u8001": "L", "\u5357": "N",
      "\u5d69": "S", "\u6850": "T", "\u4e94": "W", "\u90d1": "Z"
    };

    function initialOf(name) {
      var ch = String(name || "").charAt(0);
      return PINYIN_INITIAL[ch] || "#";
    }

    function weekdayOf(dateStr) {
      var d = new Date(dateStr + "T12:00:00");
      return "\u5468" + ["\u65e5", "\u4e00", "\u4e8c", "\u4e09", "\u56db", "\u4e94", "\u516d"][d.getDay()];
    }

    /* Real sunrise / sunset minute for a spot on a given local date. */
    function eventMinutes(spot, dateStr, kind) {
      var noon = new Date(dateStr + "T12:00:00");
      var st = calcSunTimes(spot.lat, spot.lon, noon);
      return kind === "sunrise" ? st.sunriseMin : st.sunsetMin;
    }

    /* Per-day best golden-window sample for one spot. */
    function dayPeaks(spot) {
      var out = {};
      (spot.hourly || []).forEach(function (h) {
        var e = h.sun_elevation;
        if (e == null || e < -5 || e > 8) return;
        var date = (h.time_local || "").slice(0, 10);
        if (!date) return;
        var kind = (h.sun_hour_angle || 0) > 0 ? "sunset" : "sunrise";
        var cur = out[date];
        if (!cur || num(h.bci) > cur.bci) {
          out[date] = {
            date: date, kind: kind, bci: num(h.bci), sci: num(h.sci),
            bci_grade: h.bci_grade || "",
            cloud_high: h.cloud_high, cloud_low: h.cloud_low,
            visibility_km: h.visibility_km, inversion_height_m: h.inversion_height_m,
            time: formatMin(eventMinutes(spot, date, kind))
          };
        }
      });
      return out;
    }

    /* 每日拆分为日出 / 日落 / 云海三档，口径与 dayPeaks 一致。 */
    function daySplit(spot) {
      var out = {};
      if (!spot) return out;
      (spot.hourly || []).forEach(function (h) {
        var e = h.sun_elevation;
        if (e == null || e < -5 || e > 8) return;
        var date = (h.time_local || "").slice(0, 10);
        if (!date) return;
        var r = out[date];
        if (!r) {
          r = out[date] = {
            date: date,
            sunrise: { bci: null, grade: "", time: "" },
            sunset: { bci: null, grade: "", time: "" },
            sci: { value: null, time: "" }
          };
        }
        var slot = num(h.sun_hour_angle) > 0 ? r.sunset : r.sunrise;
        if (h.bci != null && (slot.bci == null || num(h.bci) > slot.bci)) {
          slot.bci = num(h.bci);
          slot.grade = h.bci_grade || "";
        }
        if (h.sci != null && (r.sci.value == null || num(h.sci) > r.sci.value)) {
          r.sci.value = num(h.sci);
          r.sci.time = (h.time_local || "").slice(11, 16);
        }
      });
      if (spot.lat != null && spot.lon != null) {
        Object.keys(out).forEach(function (d) {
          out[d].sunrise.time = formatMin(eventMinutes(spot, d, "sunrise"));
          out[d].sunset.time = formatMin(eventMinutes(spot, d, "sunset"));
        });
      }
      return out;
    }

    /* 所选事件那一刻的单点读数。
       与 PRO 宫格同源（hourlyAtEvent + resolveEvent），
       保证同一屏上下所有数字都指向同一个时刻。 */
    function eventPeaks(spot) {
      var ev = resolveEvent(spot);
      var row = hourlyAtEvent(spot, ev);
      if (!row) {
        var near = nearestHourly(spot && spot.hourly);
        return {
          ev: ev, row: near,
          bci: near && near.bci != null ? num(near.bci) : 0,
          sci: near && near.sci != null ? num(near.sci) : 0,
          isFire: true, lead: near && near.bci != null ? num(near.bci) : 0,
          date: ev ? ev.date : "", time: ev ? ev.time : ""
        };
      }
      var bciVal = row.bci != null ? num(row.bci) : 0;
      var sciVal = row.sci != null ? num(row.sci) : 0;
      return {
        ev: ev, row: row,
        bci: bciVal, sci: sciVal,
        isFire: bciVal >= sciVal,
        lead: bciVal >= sciVal ? bciVal : sciVal,
        date: ev && ev.date ? ev.date : (row.time_local || "").slice(0, 10),
        time: ev && ev.time ? ev.time : (row.time_local || "").slice(11, 16)
      };
    }

    /* 三日窗口内 BCI / SCI 各自的峰值（统一口径）。
       口径与 dayPeaks 一致：仅统计 sun_elevation ∈ [-5, 8] 的日出日落样本。 */
    function windowPeaks(spot) {
      var per = {};
      (spot && spot.hourly || []).forEach(function (h) {
        var e = h.sun_elevation;
        if (e == null || e < -5 || e > 8) return;
        var date = (h.time_local || "").slice(0, 10);
        if (!date) return;
        var r = per[date] || (per[date] = { bci: null, sci: null });
        if (h.bci != null && (!r.bci || h.bci > r.bci.bci)) r.bci = h;
        if (h.sci != null && (!r.sci || h.sci > r.sci.sci)) r.sci = h;
      });
      var dates = Object.keys(per).sort().slice(0, 3);
      var pick = function (key) {
        var best = null, bestDate = "";
        dates.forEach(function (d) {
          var r = per[d][key];
          if (r && (!best || r[key] > best[key])) { best = r; bestDate = d; }
        });
        return { row: best, date: bestDate };
      };
      var b = pick("bci"), s = pick("sci");
      var bciVal = b.row ? num(b.row.bci) : 0;
      var sciVal = s.row ? num(s.row.sci) : 0;
      return {
        bci: bciVal, bciDate: b.date, bciRow: b.row,
        sci: sciVal, sciDate: s.date, sciRow: s.row,
        isFire: bciVal >= sciVal,
        lead: bciVal >= sciVal ? bciVal : sciVal
      };
    }

    /* 三日中「当日峰值 ≥ 35」的天数。
       35 与 fireVerdict / seaVerdict 的「备 / 蹲」分界同源：
       0 天必然对应「收脚架」，3 天必然对应「蹲」或「冲」，因此与决断标签不会冲突。 */
    function stableDays(spot, key) {
      var per = {};
      (spot && spot.hourly || []).forEach(function (h) {
        var e = h.sun_elevation;
        if (e == null || e < -5 || e > 8) return;
        var d = (h.time_local || "").slice(0, 10);
        if (!d) return;
        if (h[key] != null && (per[d] == null || h[key] > per[d])) per[d] = h[key];
      });
      var dates = Object.keys(per).sort().slice(0, 3);
      var ok = 0;
      /* 与展示同口径：先取整再比 35，避免「显示 35 分却算作未达标」。 */
      dates.forEach(function (d) { if (Math.round(num(per[d])) >= 35) ok++; });
      return { days: ok, total: dates.length };
    }

    /* Next 3 local dates present in the dataset. */
    function forecastDates(data) {
      var seen = {};
      (data.spots || []).forEach(function (s) {
        (s.hourly || []).forEach(function (h) {
          var d = (h.time_local || "").slice(0, 10);
          if (d) seen[d] = 1;
        });
      });
      return Object.keys(seen).sort().slice(0, 3);
    }

    function buildTimeline(spot) {
      if (!spot || spot.lat == null || spot.lon == null) return [];
      var ev = resolveEvent(spot);
      if (!ev) return [];
      var dayObj = new Date(ev.date + "T12:00:00");
      var st = calcSunTimes(spot.lat, spot.lon, dayObj);
      var items = [];
      if (ev.kind === "sunrise") {
        items.push({ t: formatMin(st.sunriseMin - 24), label: "蓝调时刻", icon: "\uD83C\uDF06", tone: "blue", desc: "破晓前冷蓝" });
        items.push({ t: formatMin(st.sunriseMin - 10), label: "晨光破晓", icon: "\uD83C\uDF05", tone: "touch", desc: "东方露白" });
        items.push({ t: formatMin(st.sunriseMin), label: "日出触地", icon: "\uD83D\uDD25", tone: "peak", desc: "第一缕晨光" });
        items.push({ t: formatMin(st.sunriseMin + 20), label: "黄金时刻", icon: "\u2728", tone: "golden", desc: "金黄侧逆光" });
      } else {
        items.push({ t: formatMin(st.sunsetMin - 30), label: "黄金时刻", icon: "\u2728", tone: "golden", desc: "侧逆光暖调" });
        items.push({ t: formatMin(st.sunsetMin), label: "日落触地", icon: "\uD83C\uDF05", tone: "touch", desc: "太阳落入地平线" });
        items.push({ t: formatMin(st.sunsetMin + 8), label: "点燃巅峰", icon: "\uD83D\uDD25", tone: "peak", desc: "核心爆发期 约9分钟" });
        items.push({ t: formatMin(st.sunsetMin + 24), label: "蓝调时刻", icon: "\uD83C\uDF06", tone: "blue", desc: "深蓝冷暖反差" });
      }
      return items;
    }

    function toneColor(v, hi, mid, lo) {
      if (v >= hi) return "var(--good)";
      if (v >= mid) return "var(--fair)";
      return lo == null ? "var(--bad)" : lo;
    }

    function toneInk(v, hi, mid, lo) {
      if (v >= hi) return "var(--good-ink)";
      if (v >= mid) return "var(--fair-ink)";
      return lo == null ? "var(--bad-ink)" : lo;
    }

    /* 平滑阶跃，与原 Python _smoothstep 同口径（前端仅用于文案分档提示）。 */
    function smoothstep(e0, e1, x) {
      if (e0 === e1) return x < e0 ? 0 : 1;
      var t = clamp((x - e0) / (e1 - e0), 0, 1);
      return t * t * (3 - 2 * t);
    }
    /* 太阳掠射闸门，对齐 core/physics/burning_cloud.py::_sun_score。 */
    function sunScore(e) {
      if (e == null) return 0.5;
      if (e <= -2.0) return 0.03 + 0.97 * smoothstep(-12.0, -2.0, e);
      if (e <= 6.0) return 1.0;
      return 1.0 - 0.95 * smoothstep(6.0, 26.0, e);
    }
    /* 中高云画布质量，对齐 core/physics/burning_cloud.py::cloud_canvas（仅用于 bci_components 缺失时兜底）。 */
    function canvasQuality(mid, high) {
      var qh = 0.92 * Math.exp(-Math.pow((high - 58.0) / 38.0, 2));
      qh *= 1 - 0.75 * smoothstep(85.0, 118.0, high);
      var presence = smoothstep(3.0, 18.0, mid);
      var qm = 0.92 * Math.exp(-Math.pow((mid - 30.0) / 32.0, 2));
      qm *= (1 - 0.85 * smoothstep(45.0, 82.0, mid)) * presence;
      qm *= 0.55 + 0.45 * smoothstep(0.0, 40.0, high);
      var midVeil = 1 - 0.80 * smoothstep(30.0, 85.0, mid);
      return Math.max(0.01, Math.max(qh * midVeil, qm));
    }

    /* 8-cell core PRO physics breakdown, all null-safe. */
    function buildProCells(spot) {
      var cur = nearestHourly(spot.hourly) || {};
      var be = hourlyAtEvent(spot, resolveEvent(spot)) || spot.best_evening || spot.best_sunrise || {};
      var h = be || {};
      var src = {};
      ["cloud_low", "cloud_mid", "cloud_high", "visibility_km"]
        .forEach(function (k) { src[k] = (h[k] != null ? h[k] : cur[k]); });
      var vis = num(src.visibility_km, 15);
      var cl = num(src.cloud_low), cm = num(src.cloud_mid), ch = num(src.cloud_high);
      var dir = (spot.orientation && spot.orientation.primary) || "W";
      var corridor = Math.round(clamp(100 - 0.5 * cm - 0.18 * cl + (vis - 12) * 1.6, 0, 100));

      var e = h.sun_elevation != null ? num(h.sun_elevation)
        : (cur.sun_elevation != null ? num(cur.sun_elevation) : null);
      var spct = Math.round(sunScore(e) * 100);
      var sunG = e == null ? "无高度记录"
        : e <= -12 ? "太阳已落深"
        : e <= -6 ? "余晖微弱"
        : e <= -2 ? "贴地平线"
        : e <= 2 ? "掠射峰值"
        : e <= 6 ? "低角度暖光"
        : e <= 26 ? "光线上抬转白"
        : "白光冲淡";

      var bc = h.bci_components || null;
      var cloud = bc && bc.cloud != null ? num(bc.cloud) : canvasQuality(cm, ch);
      var cloudPct = clamp(cloud * 100, 0, 100);

      var sunAz = h.sun_azimuth != null ? num(h.sun_azimuth)
        : (cur.sun_azimuth != null ? num(cur.sun_azimuth) : null);
      var orientAz = spot.orientation && spot.orientation.azimuth_deg != null
        ? num(spot.orientation.azimuth_deg) : null;
      var dAz = null;
      if (sunAz != null && orientAz != null) {
        dAz = Math.abs(sunAz - orientAz);

      var dAzG = dAz == null ? "无朝向记录"
        : dAz <= 20 ? "正对光路"

        },

        },

          g: dAzG, pct: dAzPct,

        },

        },

          g: vis >= 20 ? "通透水晶" : vis >= 10 ? "视线良好" : "轻雾遮蔽", pct: clamp(vis * 3.3, 0, 100),
          c: toneColor(vis, 20, 10),

    /* 出工胜算 + 逆温/风速：填充左栏底部，用于判断这一趟值不值得跑。
       win = hourlyAtEvent(spot, ev)，已由 renderSpotDetail 算好传入。 */
    function confBlock(stab, win, wp, isFire) {
      var spot = null;
      (state.spots || []).forEach(function (s) {
        if (!spot && s.id === state.selectedSpotId) spot = s;
      });
      var leadVal = wp ? wp.lead : 0;
      var block = el("div", "panel-block");
      block.appendChild(el("div", "pb-title", "🎯 出工胜算"));
      var row = el("div", "conf-row");

      var days = stab ? stab.days : null;
      var total = stab ? stab.total : 3;
      var pct = days == null || !total ? 0 : Math.round(days / total * 100);
      var c1 = el("div", "conf-cell");
      c1.appendChild(el("div", "ck", "🎯 三日达标"));
      var v1 = el("div", "cv");
      if (days == null) v1.textContent = "—";
      else v1.innerHTML = days + "<small> / " + total + " 天</small>";
      c1.appendChild(v1);
      var dayBest = null;
      (spot.hourly || []).forEach(function (h) {
        var e0 = h.sun_elevation;
        if (e0 == null || e0 < -5 || e0 > 8) return;
        if ((h.time_local || "").slice(0, 10) !== (wp.date || "")) return;
        var v0 = isFire ? h.bci : h.sci;
        if (v0 != null && (dayBest == null || num(v0) > dayBest)) dayBest = num(v0);
      });
      c1.appendChild(el("div", "cg", days == null || dayBest == null
        ? "无窗口数据"
        : "此刻 " + Math.round(leadVal) + " · 当日峰 " + Math.round(dayBest)));
      var bar = el("div", "conf-bar");
      var bi = el("i");
      bi.style.width = clamp(pct, 0, 100) + "%";
      bi.style.background = days == null ? "var(--text-3)"
        : days >= 3 ? "var(--good)" : days === 2 ? "var(--fair)" : "var(--bad)";
      bar.appendChild(bi);
      c1.appendChild(bar);
      row.appendChild(c1);

      var h = win || {};
      var inv = h.inversion_strength != null ? num(h.inversion_strength) : null;
      var invH = h.inversion_height_m != null ? num(h.inversion_height_m) : null;
      var c2 = el("div", "conf-cell");
      c2.appendChild(el("div", "ck", "\uD83C\uDF2B\uFE0F \u9006\u6E29\u5F3A\u5EA6"));
      var v2 = el("div", "cv");
      if (inv == null) v2.textContent = "\u2014";
      else v2.innerHTML = inv.toFixed(1) + "<small> \u2103</small>";
      c2.appendChild(v2);
      c2.appendChild(el("div", "cg", inv == null ? "\u65E0\u9006\u6E29\u8BB0\u5F55"
        : inv >= 3 ? "\u5F3A\u9006\u6E29 \u00B7 \u4E91\u6D77\u53EF\u671F"
        : inv >= 1.5 ? "\u5F31\u9006\u6E29 \u00B7 \u5C40\u90E8\u6210\u5C42"
        : "\u65E0\u660E\u663E\u9006\u6E29"));
      if (invH != null) c2.appendChild(el("div", "cg", "\u9876\u5C42 " + Math.round(invH) + " m"));
      row.appendChild(c2);

      var wind = h.wind_speed_10m != null ? num(h.wind_speed_10m) : null;
      var c3 = el("div", "conf-cell");
      c3.appendChild(el("div", "ck", "\uD83D\uDCA8 \u5730\u9762\u98CE\u901F"));
      var v3 = el("div", "cv");
      if (wind == null) v3.textContent = "\u2014";
      else v3.innerHTML = wind.toFixed(1) + "<small> m/s</small>";
      c3.appendChild(v3);
      c3.appendChild(el("div", "cg", wind == null ? "\u65E0\u98CE\u901F\u8BB0\u5F55"
        : wind <= 3 ? "\u9759\u98CE \u00B7 \u4E09\u811A\u67B6\u7A33"
        : wind <= 6 ? "\u5FAE\u98CE \u00B7 \u53EF\u6301\u7A33"
        : wind <= 10 ? "\u5927\u98CE \u00B7 \u6CE8\u610F\u6296\u52A8"
        : "\u5F3A\u98CE \u00B7 \u614E\u62CD\u957F\u66DD"));
      row.appendChild(c3);

      block.appendChild(row);
      return block;
    }

    function proGridBlock(title, tagText, cells) {
      var block = el("div", "panel-block");
      var t = el("div", "pb-title");
      t.appendChild(document.createTextNode(title));
      if (tagText) t.appendChild(el("span", "tag", tagText));
      block.appendChild(t);
      var grid = el("div", "pro-grid");
      cells.forEach(function (c) {
        var cell = el("div", "pro-cell");
        cell.appendChild(el("div", "pro-k", c.icon + " " + c.k));
        var v = el("div", "pro-v");
        var b = el("b", null, c.v);
        if (c.ink) b.style.color = c.ink;
        v.appendChild(b);
        var em = el("em", null, c.unit ? c.unit + (c.g ? " · " + c.g : "") : c.g);
        v.appendChild(em);
        cell.appendChild(v);
        if (c.pct != null) {
          var bar = el("div", "pro-bar");
          var i = el("i");

    function timelineBlock(spot) {
      var items = buildTimeline(spot);
      if (items.length < 2) return null;
      var ev = resolveEvent(spot);
      var block = el("div", "panel-block");
      block.appendChild(el("div", "pb-title", "\uD83D\uDCC5 出工实战时刻" + (ev ? " \u00b7 " + ev.text : "")));
      var tl = el("div", "timeline");
      items.forEach(function (it) {
        var item = el("div", "tl-item");
        var dot = el("div", "tl-dot " + it.tone, it.icon);
        item.appendChild(dot);
        item.appendChild(el("div", "tl-time", it.t));
        item.appendChild(el("div", "tl-label", it.label));
        item.appendChild(el("div", "tl-desc", it.desc));

    function syncOverviewActive(id) {
      var list = $("overviewList");
      if (!list) return;
      var rows = list.querySelectorAll(".ov-row");
      if (!rows.length) return;
      for (var i = 0; i < rows.length; i++) {
        var row = rows[i];
        var on = row.dataset.spotId === id;
        row.classList.toggle("is-active", on);
        row.setAttribute("aria-pressed", on ? "true" : "false");
      }
    }

    function renderOverview(data) {
      var list = $("overviewList");
      if (!list) return;
      var spots = (data.spots || []).slice();
      var dates = forecastDates(data);

      spots.sort(function (a, b) {
        var ia = initialOf(a.name), ib = initialOf(b.name);
        if (ia !== ib) return ia < ib ? -1 : 1;
        return String(a.name).localeCompare(String(b.name), "zh-Hans-CN");
      });

      list.innerHTML = "";
      if (!spots.length) {
        list.appendChild(el("div", "empty", "\u6682\u65e0\u53ef\u7528\u673a\u4f4d"));
        return;
      }

      list.setAttribute("role", "group");
      list.setAttribute("aria-label", "\u673a\u4f4d\u603b\u89c8\uff1a\u672a\u6765\u4e09\u5929\u65e5\u51fa\u65e5\u843d\u6307\u6570");

      var head = el("div", "ov-head");
      head.setAttribute("aria-hidden", "true");

      dates.forEach(function (date) {
        var hc = el("div", "ov-day");
        hc.appendChild(el("div", "d", date.slice(5).replace("-", "/")));
        hc.appendChild(el("div", "w", weekdayOf(date)));
        var hu = el("div", "u");
        hu.appendChild(el("span", null, "\u65e5\u51fa"));
        hu.appendChild(el("span", null, "\u65e5\u843d"));
        hu.appendChild(el("span", null, "\u4e91\u6d77"));
        hc.appendChild(hu);
        head.appendChild(hc);
      });
      list.appendChild(head);

      spots.forEach(function (s) {
        var splits = daySplit(s);
        var row = el("button", "ov-row");
        row.type = "button";
        row.dataset.spotId = s.id;
        row.setAttribute("aria-pressed", "false");

        var dayText = dates.map(function (date) {
          var sp = splits[date];
          if (!sp) return date.slice(5).replace("-", "/") + " \u65e0\u6570\u636e";
          var srb = sp.sunrise && sp.sunrise.bci != null ? Math.round(sp.sunrise.bci) : "\u2014";
          var ssb = sp.sunset && sp.sunset.bci != null ? Math.round(sp.sunset.bci) : "\u2014";
          var scb = sp.sci && sp.sci.value != null ? Math.round(sp.sci.value) : "\u2014";
          return date.slice(5).replace("-", "/") + " \u65e5\u51fa" + srb +
            " \u65e5\u843d" + ssb + " \u4e91\u6d77" + scb;
        }).join("\uff1b");
        row.setAttribute("aria-label", s.name + "\uff0c" + (s.region || "") + "\uff0c\u6d77\u62d4" +
          num(s.elevation_m) + "\u7c73\uff1a" + dayText);
        row.appendChild(el("div", "ov-badge", initialOf(s.name)));

        var nameWrap = el("div", "ov-name");
        nameWrap.appendChild(el("div", "n", s.name));
        var meta = el("div", "m");
        meta.appendChild(el("span", "region", (s.region || "\u2014") + " \u00b7 "));
        meta.appendChild(document.createTextNode(num(s.elevation_m) + " m"));
        nameWrap.appendChild(meta);

        if (dates[0] && s.lat != null && s.lon != null) {
          var timesEl = el("div", "ov-times",
            "\u65e5\u51fa " + formatMin(eventMinutes(s, dates[0], "sunrise")) +
            " \u00b7 \u65e5\u843d " + formatMin(eventMinutes(s, dates[0], "sunset")));
          timesEl.title = dates.map(function (d) {
            return d.slice(5).replace("-", "/") +
              " \u51fa " + formatMin(eventMinutes(s, d, "sunrise")) +
              " \u843d " + formatMin(eventMinutes(s, d, "sunset"));
          }).join(" \u00b7 ");
          nameWrap.appendChild(timesEl);
        }

        var dir = (s.orientation && s.orientation.primary) || "";
        var focal = s.recommended_focal_length_mm;
        var m2bits = [];
        if (dir) m2bits.push(dir + "\u5411");
        if (focal && focal.length === 2) m2bits.push(focal[0] + "-" + focal[1] + "mm");
        if (m2bits.length) nameWrap.appendChild(el("div", "m2", m2bits.join(" \u00b7 ")));
        row.appendChild(nameWrap);

        dates.forEach(function (date) {
          var sp = splits[date];
          var cell = el("div", "ov-day");
          var tri = el("div", "ov-tri");
          var items = [
            { k: "\u51fa", time: sp && sp.sunrise ? sp.sunrise.time : "", score: sp && sp.sunrise ? sp.sunrise.bci : null },
            { k: "\u843d", time: sp && sp.sunset ? sp.sunset.time : "", score: sp && sp.sunset ? sp.sunset.bci : null },
            { k: "\u4e91", time: sp && sp.sci ? sp.sci.time : "", score: sp && sp.sci ? sp.sci.value : null }
          ];
          items.forEach(function (it) {
            var m = el("div", "ov-m");
            m.appendChild(el("span", "k", it.k));
            var b = el("b", null, it.score == null ? "\u2014" : String(Math.round(it.score)));
            if (it.score == null) m.classList.add("is-dim");
            else b.style.color = bciColor(it.score);
            m.appendChild(b);
            tri.appendChild(m);
          });
          cell.appendChild(tri);
          if (!sp) cell.classList.add("is-empty");
          cell.title = date.slice(5).replace("-", "/") +
            " \u65e5\u51fa " + (items[0].time || "\u2014") +
            " BCI " + (items[0].score == null ? "\u2014" : Math.round(items[0].score)) +
            " \u00b7 \u65e5\u843d " + (items[1].time || "\u2014") +
            " BCI " + (items[1].score == null ? "\u2014" : Math.round(items[1].score)) +
            " \u00b7 \u4e91\u6d77 SCI " + (items[2].score == null ? "\u2014" : Math.round(items[2].score));
          row.appendChild(cell);
        });

        row.addEventListener("click", function () {
          selectSpot(s, false);
          var sec = $("detailSection");
          if (sec && sec.scrollIntoView) sec.scrollIntoView({ behavior: "smooth", block: "start" });
        });

        list.appendChild(row);
      });

      if (state.selectedSpotId) syncOverviewActive(state.selectedSpotId);

      var note = $("overviewNote");
      if (note) note.textContent = spots.length +
        " 个机位 · 未来三天 · 每格依次为日出 BCI / 日落 BCI / 云海 SCI，满分 100";
    }

    function gradePill(label, value, grade, color, dateStr) {
      var p = el("span", "spot-grade");
      var dot = el("span", "dot");
      dot.style.background = color;
      p.appendChild(dot);
      p.appendChild(document.createTextNode(label + " "));
      p.appendChild(el("b", null, String(value)));
      if (grade) p.appendChild(document.createTextNode(" · " + grade));
      if (dateStr) p.appendChild(el("span", "pill-date", dateStr.slice(5).replace("-", "/")));

    }

    /* Single-point deep dive: rendered once for the selected spot only. */
    function renderSpotDetail(spot) {
      var sec = $("detailSection"), box = $("spotDetail");
      if (!sec || !box) return;
      box.innerHTML = "";
      sec.hidden = false;
      if (!spot) {
        box.appendChild(el("div", "detail-empty", "请在上方下拉框选择机位"));
        return;
      }

      var status = spot.status || {};
      var current = nearestHourly(spot.hourly);
      var wp = eventPeaks(spot);
      var isFire = wp.isFire;
      var leadVal = wp.lead;
      /* 展示与判定必须用同一个取整值，否则会出现「显示 35 分、判定收脚架」。 */
      var leadShown = Math.round(leadVal);
      var leadRow = wp.row;
      var leadDate = wp.date;
      var sciStatus = (wp.row && wp.row.sci_status) || status.peak_sci_status || "—";
      var verdict = isFire ? fireVerdict(leadShown) : seaVerdict(leadShown, sciStatus);

      // 1. 头部名牌 + 双指数
      var head = el("div", "detail-head");
      var nameWrap = el("div");
      nameWrap.appendChild(el("div", "dh-name", spot.name));
      nameWrap.appendChild(el("div", "dh-meta", "⛰️ " + spot.elevation_m + " m · " +
        (spot.region || "") + " · " +
        (status.weather_text || (spot.ground && spot.ground.text) || "—")));
      var headGrades = el("div", "spot-grades");
      headGrades.appendChild(gradePill("🔥 火烧云", Math.round(wp.bci),
        (wp.row && wp.row.bci_grade) || "", bciColor(wp.bci)));
      headGrades.appendChild(gradePill("☁️ 云海", Math.round(wp.sci), sciStatus, "#0a84ff"));
      nameWrap.appendChild(headGrades);
      head.appendChild(nameWrap);
      head.appendChild(el("span", "decision-tag " + verdict.tone, verdict.label));
      box.appendChild(head);

      // 2. 出工决断 (紧凑条带模式，绝不膨胀占满全屏)
      var ev = resolveEvent(spot);
      var win = hourlyAtEvent(spot, ev) || (isFire ? (spot.best_evening || spot.best_morning || {}) : (spot.best_sea || {}));
      var stab = stableDays(spot, isFire ? "bci" : "sci");
      function pick(k) {
        if (win && win[k] != null) return win[k];
        if (current && current[k] != null) return current[k];
        return null;
      }

      var decBlock = el("div", "panel-block");
      decBlock.style.paddingTop = "10px";
      decBlock.appendChild(el("div", "pb-title", "🎯 出工决断"));
      
      var decStrip = el("div", "compact-dec-strip " + verdict.tone);
      var dsLeft = el("div", "cds-left");
      dsLeft.innerHTML = '<b class="cds-tag">' + verdict.label + '</b>' +
        '<span class="cds-score">' + (isFire ? "BCI " : "SCI ") + leadShown + '分</span>';
      
      function pickPct(k) {
        var v = pick(k);
        return v != null ? Math.round(num(v)) + "%" : "—";
      }
      var reasonsText = "中云" + pickPct("cloud_mid") + " · " +
        "卷云" + pickPct("cloud_high") + " · " +
        "低云" + pickPct("cloud_low") + " · " +
        "能见度" + (pick("visibility_km") != null ? Math.round(pick("visibility_km")) + "km" : "—");
      dsLeft.appendChild(el("div", "cds-reasons", reasonsText));
      decStrip.appendChild(dsLeft);

      if (ev) {
        var dsRight = el("div", "cds-right");
        dsRight.appendChild(el("span", "cds-prob",
          (ev.kindLabel || "") + " " + ev.time));
        dsRight.appendChild(el("span", "cds-cap", "· 所选时刻"));
        decStrip.appendChild(dsRight);
      }
      decBlock.appendChild(decStrip);

      var cols = el("div", "detail-cols");
      var colL = el("div", "dcol dcol-left");
      var colR = el("div", "dcol dcol-right");
      colL.appendChild(decBlock);

      // 3. 出工实战时刻 (4阶段时间轴)
      var tl = timelineBlock(spot);
      if (tl) colL.appendChild(tl);

      // 3.5 出工胜算 + 逆温/风速
      colL.appendChild(confBlock(stab, win, wp, isFire));

      // 4. PRO 核心气象 (8宫格)
      colR.appendChild(proGridBlock("⚙️ PRO 核心气象", "PRO", buildProCells(spot)));

      cols.appendChild(colL);
      cols.appendChild(colR);
      box.appendChild(cols);

      var sub = $("detailSubtitle");
      if (sub) sub.textContent = "实战时刻轴与核心物理参数 · " + (spot.region || "—") + " · " + num(spot.elevation_m) + " m";
    }

    function selectSpot(spot, noScroll) {
      if (!spot) return;
      state.selectedSpotId = spot.id;
      var sel = $("spotSelect");
      if (sel && sel.value !== spot.id) sel.value = spot.id;
      renderTimeSelect(spot);
      renderSpotDetail(spot);
      syncOverviewActive(spot.id);
    }

    function renderSpots(data) {
      var spots = data.spots || [];
      state.spots = spots;
      var sel = $("spotSelect");
      if (!sel) return;
      sel.innerHTML = "";
      if (!spots.length) {
        renderSpotDetail(null);
        return;
      }
      var bestSpot = spots[0];
      var bestScore = -1;
      spots.forEach(function (s) {
        var opt = document.createElement("option");
        opt.value = s.id;
        var wps = windowPeaks(s);
        var topScore = wps.lead;
        opt.textContent = s.name;
        sel.appendChild(opt);
        if (topScore > bestScore) {
          bestScore = topScore;
          bestSpot = s;
        }
      });
      var initSpot = bestSpot;
      if (state.selectedSpotId) {
        var found = spots.find(function (s) { return s.id === state.selectedSpotId; });
        if (found) initSpot = found;
      }
      sel.value = initSpot.id;
      selectSpot(initSpot, true);
      sel.onchange = function () {
        var chosen = spots.find(function (s) { return s.id === sel.value; });
        if (chosen) selectSpot(chosen, false);
      };
    }

    /* ------------------------------------------------------------------ *
     * Data loading                                                        *
     * ------------------------------------------------------------------ */
    function setLoading(loading) {
      var btn = $("refreshBtn");
      if (btn) btn.classList.toggle("spin", !!loading);
    }

    function load(bust) {
      setLoading(true);
      var url = "data/forecast.json" + (bust ? "?t=" + Date.now() : "");
      return fetch(url, { cache: bust ? "no-store" : "default" })
        .then(function (r) {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.json();
        })
        .then(function (data) {
          state.data = data;
          renderHeader(data);
          renderBanner(data);
          renderSpots(data);
          renderOverview(data);
          if (bust) toast("数据已刷新 · " + fmtUpdated(data.meta && data.meta.generated_at));
        })
        .catch(function (err) {
          console.error(err);
          var box = $("bannerScroll");
          box.innerHTML = "";
          var e = el("div", "empty");
          e.appendChild(el("div", "big", "\u26A0\uFE0F"));
          e.appendChild(el("div", null, "数据加载失败：" + err.message));
          box.appendChild(e);
          if (bust) toast("刷新失败：" + err.message);
        })
        .then(function () { setLoading(false); });
    }

    function boot() {
      initTheme();
      $("refreshBtn").addEventListener("click", function () { load(true); });
      load(false);
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", boot);
    } else {
      boot();
    }
  })();
  </script>
</body>
</html>
